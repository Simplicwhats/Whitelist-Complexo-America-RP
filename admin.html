<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b10"><title>Painel Administrativo | Complexo America RP</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"><style>.admin-page{max-width:1250px;margin:0 auto;padding:40px 22px 80px}.admin-box{background:#11151d;border:1px solid #292f3a;border-radius:18px;padding:24px;margin:18px 0}.admin-login{max-width:480px}.admin-toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.admin-toolbar input{flex:1;min-width:220px}.admin-layout{display:grid;grid-template-columns:minmax(260px, .75fr) minmax(0,1.5fr);gap:18px}.admin-list{display:grid;gap:8px;align-content:start}.admin-candidate{display:block;text-align:left;background:#171d27;border:1px solid #303744;border-radius:10px;padding:14px;color:#fff;cursor:pointer}.admin-candidate strong,.admin-candidate small{display:block}.admin-candidate small{color:#a8b0bf;margin:5px 0}.admin-detail{background:#0d1118;border:1px solid #292f3a;border-radius:12px;padding:18px;min-width:0}.answer-card{padding:12px;border-bottom:1px solid #282e38}.answer-card small{color:#a8b0bf}.answer-card p{overflow-wrap:anywhere}.admin-detail label{margin:16px 0}.status-pill{display:inline-block;padding:5px 10px;border-radius:99px;background:#333b49;margin:8px 0}.admin-top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.admin-error{color:#ff8b8b}.admin-candidate .admin-pill{display:inline-block;padding:4px 8px;border-radius:8px;background:#333b49;font-size:12px}.hidden{display:none!important}@media(max-width:760px){.admin-layout{grid-template-columns:1fr}.admin-page{padding:24px 14px}}</style></head><body><div class="ambient"></div><header class="topbar"><a class="brand" href="index.html"><span class="brand-small">COMPLEXO</span><span class="brand-main">AMERICA <i>RP</i></span></a><nav><a class="nav-link" href="index.html">← Voltar ao site</a></nav></header><main class="admin-page"><div class="admin-top"><div><p class="eyebrow">ÁREA RESTRITA</p><h1>PAINEL <span>ADMINISTRATIVO</span></h1><p class="muted">Gerencie inscrições, confira o ID do FiveM e marque a liberação.</p></div><button class="btn btn-ghost hidden" id="adminLogout">SAIR</button></div><section class="admin-box"><form id="adminLogin" class="admin-login"><label>E-mail administrativo<input type="email" name="email" required autocomplete="username" placeholder="E-mail autorizado"></label><label>Senha<input type="password" name="password" required autocomplete="current-password" placeholder="Senha da conta Supabase"></label><button class="btn btn-red" type="submit" id="adminLoginBtn">ENTRAR NO PAINEL →</button><p id="adminError" class="admin-error" role="alert"></p></form><div id="adminDashboard" class="hidden"><div class="admin-toolbar"><input id="adminSearch" placeholder="Buscar por nome, Discord, ID FiveM ou código interno"><select id="adminFilter"><option value="all">Todas as inscrições</option><option value="awaiting_id_release">Aguardando liberação do ID</option><option value="released">ID liberado</option><option value="rejected">Reprovados</option><option value="interview">Entrevista</option></select><button class="btn btn-ghost" id="adminRefresh">ATUALIZAR</button></div><div class="admin-layout"><div id="adminList" class="admin-list"></div><article id="adminDetail" class="admin-detail"><p class="muted">Selecione uma inscrição para conferir as respostas.</p></article></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="assets/js/admin.js"></script></body></html>
